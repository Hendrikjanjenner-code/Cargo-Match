      type: object
      required:
        - id
        - name
        - country
        - activities
        - primaryContactName
        - email
        - phone
        - verified
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        country:
          type: string
        activities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CompanyActivity'
        primaryContactName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        vatRegistrationNumber:
          type: [string, 'null']
        verified:
          type: boolean
        status:
          $ref: '#/components/schemas/CompanyStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
