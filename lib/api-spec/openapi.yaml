      type: string
      enum: [EXPECTED, CONFIRMED]
    DeepseaVesselProfile:
      type: object
      additionalProperties: false
      required: [vesselClass, dwtTonnes]
      properties:
        vesselClass:
          $ref: "#/components/schemas/DeepseaVesselClass"
        dwtTonnes:
          type: number
          exclusiveMinimum: 0
        summerDraftMetres:
          type: [number, "null"]
          exclusiveMinimum: 0
        gearConfiguration:
          type: [string, "null"]
          maxLength: 120
    DeepseaCargoRequirement:
      type: object
      additionalProperties: false
      properties:
        quantityTolerancePercent:
          type: number
          minimum: 0
          maximum: 99.99
          default: 0
          description: Optional owner-entered tolerance percentage; absent means exact quantity matching.
        minimumVesselDwtTonnes:
          type: [number, "null"]
          exclusiveMinimum: 0
        maximumVesselDwtTonnes:
          type: [number, "null"]
          exclusiveMinimum: 0
        maximumDraftMetres:
          type: [number, "null"]
          exclusiveMinimum: 0
        requiredGear:
          type: [string, "null"]
          maxLength: 120
          description: Exact normalized label match (trimmed, case-insensitive); e.g. "ship cranes" does not match "ungeared".
        preferredVesselClass:
          anyOf:
            - $ref: "#/components/schemas/DeepseaVesselClass"
            - type: "null"
    DeepseaCapacityExtension:
      type: object
      additionalProperties: false
      properties:
        manualPositioningDays:
          type: [number, "null"]
          minimum: 0
          maximum: 365
          description: Legacy user-estimated travel duration in days; retained for compatibility and never independently verified.
        routeChoice:
          type: string
          enum: [UNSPECIFIED, DIRECT, SUEZ, PANAMA, CAPE_GOOD_HOPE, OTHER]
          default: UNSPECIFIED
          description: User-selected generic route option; no route engine or licensed route data is configured.
        routeNotes:
          type: [string, "null"]
          maxLength: 500
          description: Private owner note about the manually selected route; not disclosed before connection.
        departureUncertaintyDays:
          type: [number, "null"]
          minimum: 0
          maximum: 365
          description: User-estimated departure uncertainty in days.
        positioningBufferDays:
          type: [number, "null"]
          minimum: 0
          maximum: 365
          description: User-estimated positioning buffer in days.
        approximateMaxDistanceKm:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: Geodesic approximation only, never actual sailing distance.
        previousVoyageContext:
          type: [string, "null"]
          maxLength: 4000
