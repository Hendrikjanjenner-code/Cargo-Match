                - type: "null"
            connectedCapacity:
              oneOf:
                - $ref: "#/components/schemas/ConnectedCapacityOffer"
                - type: "null"
            connectedCompanies:
              type: array
              items:
                $ref: "#/components/schemas/ConnectedCompany"
    MatchActionRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/MatchAction"
    MatchListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MatchSummary"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Conversation:
      type: object
      required:
        - id
        - matchId
        - participantCompanies
        - unreadCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        matchId:
          type: string
          format: uuid
        participantCompanies:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/ConnectedCompany"
        lastMessage:
          oneOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
        unreadCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    Message:
      type: object
      required:
        [
          id,
          conversationId,
          senderCompanyId,
          senderUserId,
          body,
          createdAt,
          readAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        senderCompanyId:
          type: string
          format: uuid
        senderUserId:
          type: string
          description: Opaque identity-provider subject identifier; not necessarily a UUID.
        body:
          type: string
          minLength: 1
          maxLength: 10000
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [string, "null"]
          format: date-time
    MessageListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    SendMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
    MarkMessagesReadRequest:
      type: object
      required: [messageIds]
      properties:
        messageIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
    ReadMessagesResponse:
      type: object
      required: [messageIds, readAt]
      properties:
        messageIds:
          type: array
          items:
            type: string
            format: uuid
        readAt:
          type: string
          format: date-time

    NotificationType:
      type: string
      enum:
        [
          NEW_MATCH,
          INTEREST_RECEIVED,
          INTEREST_ACCEPTED,
          INTEREST_DECLINED,
          NEW_MESSAGE,
          LISTING_EXPIRES_SOON,
        ]
    Notification:
      type: object
      required: [id, type, title, message, readAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/NotificationType"
        title:
          type: string
        message:
          type: string
        relatedMatchId:
          type: [string, "null"]
          format: uuid
        relatedConversationId:
          type: [string, "null"]
          format: uuid
        readAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    NotificationListResponse:
      type: object
      required: [items, page, pageSize, total, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        unreadCount:
          type: integer
          minimum: 0

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
