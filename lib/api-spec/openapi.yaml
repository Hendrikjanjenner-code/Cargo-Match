openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken.
  title: Api
  version: 0.1.0
  description: |
    CargoMatch pilot API. This contract covers the privacy-safe discovery,
    consent, and communication flow for European inland shipping. CargoMatch
    is not a booking, reservation, or freight-contract API.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Company
    description: The current user's company.
  - name: Vessels
    description: Vessels owned by the current user's company.
  - name: Locations
    description: Curated inland-shipping location catalogue.
  - name: Listings
    description: Owned cargo and capacity listings.
  - name: Marketplace
    description: Privacy-safe open-network discovery.
  - name: Matches
    description: Eligibility-filtered match opportunities and consent actions.
  - name: Conversations
    description: Conversations available after a match is connected.
  - name: Notifications
    description: In-app notifications for the current user.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /company:
    get:
      tags: [Company]
      operationId: getMyCompany
      summary: Get the current user's company
      description: Returns only the company associated with the current user's active membership.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Current company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Company]
      operationId: createMyCompany
      summary: Create a company for the current user
      description: Creates the first company and OWNER membership for an authenticated user.
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreateRequest'
      responses:
        '201':
          description: Company created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The user already belongs to a company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [Company]
      operationId: updateMyCompany
      summary: Update the current user's company
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdateRequest'
      responses:
        '200':
          description: Company updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /vessels:
    get:
      tags: [Vessels]
      operationId: listMyVessels
      summary: List the current company's vessels
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: activeOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Owned vessels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Vessels]
      operationId: createMyVessel
      summary: Create a vessel for the current company
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VesselCreateRequest'
      responses:
        '201':
          description: Vessel created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vessel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /vessels/{vesselId}:
    parameters:
      - $ref: '#/components/parameters/VesselId'
    get:
      tags: [Vessels]
      operationId: getMyVessel
      summary: Get one of the current company's vessels
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Owned vessel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vessel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Vessels]
      operationId: updateMyVessel
      summary: Update one of the current company's vessels
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VesselUpdateRequest'
      responses:
        '200':
          description: Vessel updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vessel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /vessels/{vesselId}/deactivate:
    post:
      tags: [Vessels]
      operationId: deactivateMyVessel
      summary: Deactivate a vessel
      description: Vessels are deactivated rather than deleted so historical listings remain auditable.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VesselId'
      responses:
        '200':
          description: Vessel deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vessel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /locations:
    get:
      tags: [Locations]
      operationId: listLocations
      summary: List active catalogue locations
      description: Returns curated inland-shipping locations; arbitrary free-form addresses are not part of the pilot.
      security: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: country
          in: query
          required: false
          schema:
            type: string
        - name: locationType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LocationType'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Active catalogue locations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'

  /cargo:
    get:
      tags: [Listings]
      operationId: listMyCargo
      summary: List the current company's cargo listings
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: listingStatus
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ListingStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Owned cargo listings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Listings]
      operationId: createMyCargo
      summary: Create a cargo listing for the current company
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargoListingCreateRequest'
      responses:
        '201':
          description: Cargo listing created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoListing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cargo/{cargoId}:
    parameters:
      - $ref: '#/components/parameters/CargoId'
    get:
      tags: [Listings]
      operationId: getMyCargo
      summary: Get one of the current company's cargo listings
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Owned cargo listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoListing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Listings]
      operationId: updateMyCargo
      summary: Update one of the current company's cargo listings
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargoListingUpdateRequest'
      responses:
        '200':
          description: Cargo listing updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoListing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cargo/{cargoId}/withdraw:
    post:
      tags: [Listings]
      operationId: withdrawMyCargo
      summary: Withdraw a cargo listing
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CargoId'
      responses:
        '200':
          description: Cargo listing withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoListing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cargo/{cargoId}/close:
    post:
      tags: [Listings]
      operationId: closeMyCargo
      summary: Close a cargo listing
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CargoId'
      responses:
        '200':
          description: Cargo listing closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoListing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /capacity:
    get:
      tags: [Listings]
      operationId: listMyCapacity
      summary: List the current company's capacity offers
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: listingStatus
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ListingStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Owned capacity offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Listings]
      operationId: createMyCapacity
      summary: Create a capacity offer for the current company
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacityOfferCreateRequest'
      responses:
        '201':
          description: Capacity offer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityOffer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /capacity/{capacityId}:
    parameters:
      - $ref: '#/components/parameters/CapacityId'
    get:
      tags: [Listings]
      operationId: getMyCapacity
      summary: Get one of the current company's capacity offers
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Owned capacity offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityOffer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Listings]
      operationId: updateMyCapacity
      summary: Update one of the current company's capacity offers
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacityOfferUpdateRequest'
      responses:
        '200':
          description: Capacity offer updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityOffer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /capacity/{capacityId}/withdraw:
    post:
      tags: [Listings]
      operationId: withdrawMyCapacity
      summary: Withdraw a capacity offer
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CapacityId'
      responses:
        '200':
          description: Capacity offer withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityOffer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /capacity/{capacityId}/close:
    post:
      tags: [Listings]
      operationId: closeMyCapacity
      summary: Close a capacity offer
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CapacityId'
      responses:
        '200':
          description: Capacity offer closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityOffer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /marketplace:
    get:
      tags: [Marketplace]
      operationId: listMarketplace
      summary: List privacy-safe open-network opportunities
      description: |
        Returns only ACTIVE OPEN_NETWORK opportunities for an authenticated
        active company using anonymous listing representations. Exact tonnage,
        timestamps, coordinates, company, vessel, notes, and contact fields
        are never returned by this endpoint.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: listingType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MarketplaceListingType'
        - name: vesselType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/VesselType'
        - name: cargoType
          in: query
          required: false
          schema:
            type: string
        - name: availableFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Anonymous open-network listings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceListResponse'

  /matches:
    get:
      tags: [Matches]
      operationId: listMyMatches
      summary: List matches available to the current user's company
      description: Results are redacted according to ownership and connection state.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MatchStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Privacy-safe matches for the current company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /matches/{matchId}:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    get:
      tags: [Matches]
      operationId: getMyMatch
      summary: Get one match with the permitted privacy view
      description: Exact owned or connected objects are included only when the current company is authorized to see them.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Match detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /matches/{matchId}/actions:
    post:
      tags: [Matches]
      operationId: actOnMatch
      summary: Show interest, accept, or decline a match
      description: |
        INTEREST records the current company's consent to a possible disclosure.
        The counterparty may then ACCEPT or DECLINE. ACCEPT is transactional:
        it sets CONNECTED, records mutual consent, creates exactly one
        conversation, and emits notifications. CONNECTED is not a booking.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchActionRequest'
      responses:
        '200':
          description: Match action applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invalid transition, duplicate interest, or stale match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /conversations:
    get:
      tags: [Conversations]
      operationId: listMyConversations
      summary: List conversations for connected matches
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Conversations accessible to the current user's company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      operationId: getMyConversation
      summary: Get a conversation detail
      description: A conversation is accessible only to members of its connected match.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Conversation detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations/{conversationId}/messages:
    get:
      tags: [Conversations]
      operationId: listConversationMessages
      summary: List messages in a conversation
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Messages in the authorized conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Conversations]
      operationId: sendConversationMessage
      summary: Send a message in a conversation
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations/{conversationId}/read:
    post:
      tags: [Conversations]
      operationId: markConversationMessagesRead
      summary: Mark conversation messages read for the current user
      description: Read state is per user, not a single shared company flag.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkMessagesReadRequest'
      responses:
        '200':
          description: Read state recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadMessagesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications:
    get:
      tags: [Notifications]
      operationId: listMyNotifications
      summary: List in-app notifications for the current user
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Notifications for the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark a notification read
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Notification marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: Browser session cookie.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session
      description: Opaque mobile session token.
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    VesselId:
      name: vesselId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CargoId:
      name: cargoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CapacityId:
      name: capacityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MatchId:
      name: matchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The current user is not allowed to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found or not visible to the current user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
