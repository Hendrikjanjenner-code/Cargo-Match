          type: string
          description: Anonymized loading-window band, never exact timestamps.
        distanceBand:
          type: string
          description: Broad approximate positioning band, not a route or sailing distance.
        visibility:
          type: string
          enum: [OPEN_NETWORK]
        listingStatus:
          type: string
          enum: [ACTIVE]
        deepseaRequirementsBand:
          type: string
    AnonymousCapacityListing:
      type: object
      description: |
        Privacy-safe open-network capacity representation. It intentionally
        contains bands rather than exact tonnage, timestamps, coordinates,
        vessel identity, or owner-entered notes.
      required:
        - id
        - listingType
        - transportMode
        - vesselType
        - availabilityType
        - cargoCompatibilityBand
        - directionBand
        - availabilityRegion
        - tonnageBand
        - timeBand
        - distanceBand
        - visibility
        - listingStatus
      properties:
        id:
          type: string
          format: uuid
        transportMode:
          $ref: "#/components/schemas/TransportMode"
        listingType:
          type: string
          enum: [CAPACITY]
        vesselType:
          $ref: "#/components/schemas/VesselType"
        availabilityType:
          $ref: "#/components/schemas/AvailabilityType"
        cargoCompatibilityBand:
          type: string
        directionBand:
          type: string
        availabilityRegion:
          type: string
        tonnageBand:
          type: string
          description: Anonymized available-capacity band, never an exact tonnage.
        timeBand:
          type: string
          description: Anonymized availability band, never exact timestamps.
        distanceBand:
          type: string
          description: Anonymized maximum-positioning band, never an exact distance.
        visibility:
          type: string
          enum: [OPEN_NETWORK]
        listingStatus:
          type: string
          enum: [ACTIVE]
        deepseaClassBand:
          type: string
        dwtBand:
          type: string
        availabilityConfidence:
          $ref: "#/components/schemas/AvailabilityConfidence"
        positioningConfidence:
          type: string
          enum: [PROVISIONAL, ESTIMATED]
        provisional:
          type: boolean
          description: Deepsea feasibility remains provisional because manual inputs are user-estimated, not verified route data.
    MarketplaceListing:
      oneOf:
        - $ref: "#/components/schemas/AnonymousCargoListing"
        - $ref: "#/components/schemas/AnonymousCapacityListing"
    MarketplaceListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MarketplaceListing"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    MatchStatus:
      type: string
      enum: [NEW, INTEREST_SENT, CONNECTED, DECLINED, EXPIRED]
    MatchDomain:
      type: string
      enum: [MARKETPLACE, LINER]
    MatchAction:
      type: string
      enum: [INTEREST, ACCEPT, DECLINE]
    MatchNetworkCategory:
      type: string
      enum: [OPEN_NETWORK]
    MatchScoreComponents:
      type: object
      description: Display-safe rounded component scores; no raw calculation inputs are returned.
      required:
        - distanceScore
        - timingScore
        - capacityScore
        - vesselTypeScore
        - directionScore
        - cargoCompatibilityScore
      properties:
        distanceScore:
          type: integer
          minimum: 0
          maximum: 100
        timingScore:
          type: integer
          minimum: 0
          maximum: 100
        capacityScore:
          type: integer
          minimum: 0
          maximum: 100
        vesselTypeScore:
          type: integer
          minimum: 0
          maximum: 100
        directionScore:
          type: integer
          minimum: 0
          maximum: 100
        cargoCompatibilityScore:
          type: integer
          minimum: 0
          maximum: 100
    MatchEvaluationInputs:
      type: object
      description: Anonymized bands used to explain a score without exposing precise commercial inputs.
      required:
        - distanceBand
        - timingBand
        - capacityBand
        - vesselTypeBand
        - directionBand
        - cargoCompatibilityBand
        - reachabilityStatus
        - laycanAssessment
        - routeChoice
        - departureUncertainty
        - positioningBuffer
        - routeDataAccess
        - verification
      properties:
        distanceBand:
          type: string
        timingBand:
          type: string
        capacityBand:
          type: string
        vesselTypeBand:
          type: string
        directionBand:
          type: string
        cargoCompatibilityBand:
          type: string
        reachabilityStatus:
          type: string
          enum: [UNKNOWN, USER_ESTIMATED]
        laycanAssessment:
          type: string
          enum: [UNKNOWN, WITHIN_WINDOW, UNCERTAIN, TOO_LATE]
        routeChoice:
          type: string
          enum: [NOT_CONFIGURED, USER_SELECTED]
          description: Generic status only; never an actual route choice in anonymous matching.
        departureUncertainty:
          type: string
          enum: [UNKNOWN, USER_ESTIMATED]
        positioningBuffer:
          type: string
          enum: [UNKNOWN, USER_ESTIMATED]
        routeDataAccess:
          type: string
          enum: [NOT_CONFIGURED]
        verification:
          type: string
          enum: [NOT_VERIFIED]
    MatchScore:
      type: object
      required:
        - totalScore
        - components
        - evaluationInputs
        - calculationVersion
        - calculatedAt
        - explanation
      properties:
        totalScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Rounded display score only; the stored calculation may retain full precision.
        components:
          $ref: "#/components/schemas/MatchScoreComponents"
        evaluationInputs:
          $ref: "#/components/schemas/MatchEvaluationInputs"
        calculationVersion:
          type: string
          example: v1
        calculatedAt:
          type: string
          format: date-time
        explanation:
          type: string
          description: Safe explanation that does not disclose identity or exact inputs.
        provisional:
          type: boolean
          description: True when a deepsea positioning estimate is unknown; this is not a verified route.
    MatchSummary:
      type: object
      required:
        - id
        - cargoListingId
        - capacityOfferId
        - status
        - networkCategory
        - cargo
        - capacity
        - score
        - initiatedByMe
        - canAccept
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        cargoListingId:
          type: string
          format: uuid
        capacityOfferId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/MatchStatus"
        networkCategory:
          $ref: "#/components/schemas/MatchNetworkCategory"
        cargo:
          $ref: "#/components/schemas/AnonymousCargoListing"
        capacity:
          $ref: "#/components/schemas/AnonymousCapacityListing"
        score:
          $ref: "#/components/schemas/MatchScore"
        initiatedByMe:
          type: boolean
          description: Whether the current company initiated the pending interest.
        canAccept:
          type: boolean
          description: Whether the current company may accept the pending interest.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deepseaMatch:
          anyOf:
            - $ref: "#/components/schemas/DeepseaMatchContext"
            - type: "null"
    ConnectedCargoListing:
      description: Exact cargo data permitted after connection, excluding private owner notes.
      type: object
      required:
        - id
        - companyId
        - cargoName
        - cargoType
        - weightTonnes
        - loadingLocationId
        - destinationLocationId
        - loadingFrom
        - loadingUntil
        - requiredVesselType
        - visibility
        - listingStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        transportMode:
          $ref: "#/components/schemas/TransportMode"
        cargoName:
          type: string
        cargoType:
          type: string
        weightTonnes:
          type: number
        loadingLocationId:
          type: string
          format: uuid
        destinationLocationId:
          type: string
          format: uuid
        loadingFrom:
          type: string
          format: date-time
        loadingUntil:
          type: string
          format: date-time
        expectedUnloadingDate:
          type: [string, "null"]
          format: date
        requiredVesselType:
          $ref: "#/components/schemas/VesselType"
        specialRequirements:
          type: [string, "null"]
        visibility:
          $ref: "#/components/schemas/Visibility"
        listingStatus:
          $ref: "#/components/schemas/ListingStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deepseaRequirement:
          anyOf:
            - $ref: "#/components/schemas/DeepseaCargoRequirement"
            - type: "null"
    ConnectedCapacityOffer:
      description: Exact capacity data permitted after connection, excluding private owner notes.
      type: object
      required:
        - id
        - companyId
        - vesselId
        - locationId
        - availableFrom
        - availableUntil
        - availabilityType
        - availableCapacityTonnes
        - cargoCompatibility
        - preferredDirection
        - maximumPositioningDistanceKm
        - visibility
        - availabilityConfidence
        - listingStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        transportMode:
          $ref: "#/components/schemas/TransportMode"
        vesselId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        availableFrom:
          type: string
          format: date-time
        availableUntil:
          type: string
          format: date-time
        availabilityType:
          $ref: "#/components/schemas/AvailabilityType"
        availableCapacityTonnes:
          type: number
        cargoCompatibility:
          type: array
          items:
            type: string
        preferredDirection:
          type: string
        maximumPositioningDistanceKm:
          type: number
        visibility:
          $ref: "#/components/schemas/Visibility"
        availabilityConfidence:
          $ref: "#/components/schemas/AvailabilityConfidence"
        listingStatus:
          $ref: "#/components/schemas/ListingStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deepseaExtension:
          anyOf:
            - $ref: "#/components/schemas/DeepseaCapacityExtension"
            - type: "null"
    ConnectedCompany:
      type: object
      required:
        [id, name, country, activities, primaryContactName, email, phone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        country:
          type: string
        activities:
          type: array
          items:
            $ref: "#/components/schemas/CompanyActivity"
        primaryContactName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
    MatchDetail:
      allOf:
        - $ref: "#/components/schemas/MatchSummary"
        - type: object
          required: [disclosureState]
          properties:
            disclosureState:
              type: string
              enum: [ANONYMOUS, OWNER, CONNECTED]
            ownedCargo:
              oneOf:
                - $ref: "#/components/schemas/CargoListing"
                - type: "null"
            ownedCapacity:
              oneOf:
                - $ref: "#/components/schemas/CapacityOffer"
                - type: "null"
            connectedCargo:
              oneOf:
                - $ref: "#/components/schemas/ConnectedCargoListing"
                - type: "null"
            connectedCapacity:
              oneOf:
                - $ref: "#/components/schemas/ConnectedCapacityOffer"
                - type: "null"
            connectedCompanies:
              type: array
              items:
                $ref: "#/components/schemas/ConnectedCompany"
    MatchActionRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/MatchAction"
    MatchListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MatchSummary"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Conversation:
      type: object
      required:
        - id
        - matchId
        - participantCompanies
        - unreadCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        matchId:
          type: string
          format: uuid
        participantCompanies:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/ConnectedCompany"
        lastMessage:
          oneOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
        unreadCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    Message:
      type: object
      required:
        [
          id,
          conversationId,
          senderCompanyId,
          senderUserId,
          body,
          createdAt,
          readAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        senderCompanyId:
          type: string
          format: uuid
        senderUserId:
          type: string
          description: Opaque identity-provider subject identifier; not necessarily a UUID.
        body:
          type: string
          minLength: 1
          maxLength: 10000
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [string, "null"]
          format: date-time
    MessageListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    SendMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
    MarkMessagesReadRequest:
      type: object
      required: [messageIds]
      properties:
        messageIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
    ReadMessagesResponse:
      type: object
      required: [messageIds, readAt]
      properties:
        messageIds:
          type: array
          items:
            type: string
            format: uuid
        readAt:
          type: string
          format: date-time

    NotificationType:
      type: string
      enum:
        [
          NEW_MATCH,
          INTEREST_RECEIVED,
          INTEREST_ACCEPTED,
          INTEREST_DECLINED,
          NEW_MESSAGE,
          LISTING_EXPIRES_SOON,
        ]
    Notification:
      type: object
      required: [id, type, title, message, relatedMatchDomain, readAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/NotificationType"
        title:
          type: string
        message:
          type: string
        relatedMatchId:
          type: [string, "null"]
          format: uuid
        relatedMatchDomain:
          $ref: "#/components/schemas/MatchDomain"
        relatedConversationId:
          type: [string, "null"]
          format: uuid
        readAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    NotificationListResponse:
      type: object
      required: [items, page, pageSize, total, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        unreadCount:
          type: integer
          minimum: 0

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
