      type: string
      enum: [CARGO, CAPACITY]
    AnonymousCargoListing:
      type: object
      description: |
        Privacy-safe open-network cargo representation. It intentionally
        contains bands rather than exact tonnage, timestamps, coordinates, or
        owner-entered notes.
      required:
        - id
        - listingType
        - cargoTypeBand
        - loadingRegion
        - destinationRegion
        - requiredVesselType
        - tonnageBand
        - timeBand
        - distanceBand
        - visibility
        - listingStatus
      properties:
        id:
          type: string
          format: uuid
        listingType:
          type: string
          enum: [CARGO]
        cargoTypeBand:
          type: string
        loadingRegion:
          type: string
        destinationRegion:
          type: string
        requiredVesselType:
          $ref: '#/components/schemas/VesselType'
        tonnageBand:
          type: string
          description: Anonymized cargo tonnage band, never an exact weight.
        timeBand:
          type: string
          description: Anonymized loading-window band, never exact timestamps.
        distanceBand:
          type: string
          description: Broad approximate positioning band, not a route or sailing distance.
        visibility:
          type: string
          enum: [OPEN_NETWORK]
        listingStatus:
          type: string
          enum: [ACTIVE]
    AnonymousCapacityListing:
      type: object
      description: |
        Privacy-safe open-network capacity representation. It intentionally
        contains bands rather than exact tonnage, timestamps, coordinates,
        vessel identity, or owner-entered notes.
      required:
        - id
        - listingType
        - vesselType
        - availabilityType
        - cargoCompatibilityBand
        - directionBand
        - availabilityRegion
        - tonnageBand
        - timeBand
        - distanceBand
        - visibility
        - listingStatus
      properties:
        id:
          type: string
          format: uuid
        listingType:
          type: string
          enum: [CAPACITY]
        vesselType:
          $ref: '#/components/schemas/VesselType'
        availabilityType:
          $ref: '#/components/schemas/AvailabilityType'
        cargoCompatibilityBand:
          type: string
        directionBand:
          type: string
        availabilityRegion:
          type: string
        tonnageBand:
          type: string
          description: Anonymized available-capacity band, never an exact tonnage.
        timeBand:
          type: string
          description: Anonymized availability band, never exact timestamps.
        distanceBand:
          type: string
          description: Anonymized maximum-positioning band, never an exact distance.
        visibility:
          type: string
          enum: [OPEN_NETWORK]
        listingStatus:
          type: string
          enum: [ACTIVE]
