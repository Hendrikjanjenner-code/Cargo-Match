    AnonymousCargoListing:
      type: object
      description: |
        Privacy-safe open-network cargo representation. It intentionally
        contains bands rather than exact tonnage, timestamps, coordinates, or
        owner-entered notes.
      required:
        - id
        - listingType
        - transportMode
        - cargoTypeBand
        - loadingRegion
        - destinationRegion
        - requiredVesselType
        - tonnageBand
        - timeBand
        - distanceBand
        - visibility
        - listingStatus
      properties:
        id:
          type: string
          format: uuid
        transportMode:
          $ref: "#/components/schemas/TransportMode"
        listingType:
          type: string
          enum: [CARGO]
        cargoTypeBand:
          type: string
        loadingRegion:
          type: string
        destinationRegion:
          type: string
        requiredVesselType:
          $ref: "#/components/schemas/VesselType"
        tonnageBand:
          type: string
          description: Anonymized cargo tonnage band, never an exact weight.
        timeBand:
          type: string
          description: Anonymized loading-window band, never exact timestamps.
        distanceBand:
          type: string
          description: Broad approximate positioning band, not a route or sailing distance.
        visibility:
          type: string
          enum: [OPEN_NETWORK]
        listingStatus:
          type: string
          enum: [ACTIVE]
        deepseaRequirementsBand:
          type: string
    AnonymousCapacityListing:
      type: object
      description: |
        Privacy-safe open-network capacity representation. It intentionally
        contains bands rather than exact tonnage, timestamps, coordinates,
        vessel identity, or owner-entered notes.
      required:
        - id
        - listingType
        - transportMode
        - vesselType
        - availabilityType
        - cargoCompatibilityBand
        - directionBand
        - availabilityRegion
        - tonnageBand
        - timeBand
        - distanceBand
        - visibility
        - listingStatus
      properties:
        id:
          type: string
          format: uuid
        transportMode:
          $ref: "#/components/schemas/TransportMode"
        listingType:
          type: string
          enum: [CAPACITY]
        vesselType:
          $ref: "#/components/schemas/VesselType"
        availabilityType:
          $ref: "#/components/schemas/AvailabilityType"
        cargoCompatibilityBand:
          type: string
        directionBand:
          type: string
        availabilityRegion:
          type: string
        tonnageBand:
          type: string
          description: Anonymized available-capacity band, never an exact tonnage.
        timeBand:
          type: string
          description: Anonymized availability band, never exact timestamps.
        distanceBand:
          type: string
          description: Anonymized maximum-positioning band, never an exact distance.
        visibility:
          type: string
          enum: [OPEN_NETWORK]
        listingStatus:
          type: string
          enum: [ACTIVE]
        deepseaClassBand:
          type: string
        dwtBand:
          type: string
        availabilityConfidence:
          $ref: "#/components/schemas/AvailabilityConfidence"
        positioningConfidence:
          type: string
          enum: [PROVISIONAL, ESTIMATED]
        provisional:
          type: boolean
          description: Deepsea feasibility remains provisional because manual inputs are user-estimated, not verified route data.
    MarketplaceListing:
      oneOf:
        - $ref: "#/components/schemas/AnonymousCargoListing"
        - $ref: "#/components/schemas/AnonymousCapacityListing"
    MarketplaceListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MarketplaceListing"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    MatchStatus:
      type: string
      enum: [NEW, INTEREST_SENT, CONNECTED, DECLINED, EXPIRED]
    MatchAction:
      type: string
      enum: [INTEREST, ACCEPT, DECLINE]
    MatchNetworkCategory:
      type: string
      enum: [OPEN_NETWORK]
    MatchScoreComponents:
      type: object
      description: Display-safe rounded component scores; no raw calculation inputs are returned.
      required:
        - distanceScore
        - timingScore
        - capacityScore
        - vesselTypeScore
        - directionScore
        - cargoCompatibilityScore
      properties:
        distanceScore:
          type: integer
          minimum: 0
          maximum: 100
        timingScore:
          type: integer
          minimum: 0
          maximum: 100
        capacityScore:
          type: integer
          minimum: 0
          maximum: 100
        vesselTypeScore:
          type: integer
          minimum: 0
          maximum: 100
        directionScore:
          type: integer
          minimum: 0
          maximum: 100
        cargoCompatibilityScore:
          type: integer
          minimum: 0
          maximum: 100
    MatchEvaluationInputs:
      type: object
      description: Anonymized bands used to explain a score without exposing precise commercial inputs.
      required:
        - distanceBand
        - timingBand
        - capacityBand
        - vesselTypeBand
        - directionBand
        - cargoCompatibilityBand
        - reachabilityStatus
        - laycanAssessment
        - routeChoice
        - departureUncertainty
        - positioningBuffer
        - routeDataAccess
        - verification
      properties:
        distanceBand:
          type: string
        timingBand:
          type: string
        capacityBand:
          type: string
        vesselTypeBand:
          type: string
        directionBand:
          type: string
        cargoCompatibilityBand:
          type: string
        reachabilityStatus:
          type: string
          enum: [UNKNOWN, USER_ESTIMATED]
        laycanAssessment:
          type: string
          enum: [UNKNOWN, WITHIN_WINDOW, UNCERTAIN, TOO_LATE]
        routeChoice:
          type: string
          enum: [NOT_CONFIGURED, USER_SELECTED]
          description: Generic status only; never an actual route choice in anonymous matching.
        departureUncertainty:
          type: string
          enum: [UNKNOWN, USER_ESTIMATED]
        positioningBuffer:
          type: string
          enum: [UNKNOWN, USER_ESTIMATED]
        routeDataAccess:
          type: string
          enum: [NOT_CONFIGURED]
        verification:
          type: string
          enum: [NOT_VERIFIED]
    MatchScore:
      type: object
      required:
        - totalScore
        - components
        - evaluationInputs
        - calculationVersion
        - calculatedAt
        - explanation
      properties:
        totalScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Rounded display score only; the stored calculation may retain full precision.
        components:
          $ref: "#/components/schemas/MatchScoreComponents"
        evaluationInputs:
          $ref: "#/components/schemas/MatchEvaluationInputs"
        calculationVersion:
          type: string
          example: v1
        calculatedAt:
          type: string
          format: date-time
        explanation:
          type: string
          description: Safe explanation that does not disclose identity or exact inputs.
        provisional:
          type: boolean
          description: True when a deepsea positioning estimate is unknown; this is not a verified route.
