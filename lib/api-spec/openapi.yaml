  schemas:
    AisFreshness:
      type: string
      enum: [FRESH, AGING, STALE, UNKNOWN]
    NormalizedVesselTelemetry:
      type: object
      additionalProperties: false
      required:
        - provider
        - providerVesselId
        - mmsi
        - imo
        - eni
        - vesselName
        - latitude
        - longitude
        - speedKnots
        - courseDegrees
        - headingDegrees
        - navigationStatus
        - reportedDestination
        - reportedEta
        - reportedDraughtMeters
        - observedAt
        - receivedAt
        - sourceType
        - dataFreshness
        - rawDataReference
      properties:
        provider:
          type: string
        providerVesselId:
          type: [string, "null"]
        mmsi:
          type: [string, "null"]
        imo:
          type: [string, "null"]
        eni:
          type: [string, "null"]
        vesselName:
          type: [string, "null"]
        latitude:
          type: [number, "null"]
          minimum: -90
          maximum: 90
        longitude:
          type: [number, "null"]
          minimum: -180
          maximum: 180
        speedKnots:
          type: [number, "null"]
          minimum: 0
        courseDegrees:
          type: [number, "null"]
          minimum: 0
          exclusiveMaximum: 360
        headingDegrees:
          type: [number, "null"]
          minimum: 0
          exclusiveMaximum: 360
        navigationStatus:
          type: [string, "null"]
        reportedDestination:
          type: [string, "null"]
        reportedEta:
          type: [string, "null"]
          format: date-time
        reportedDraughtMeters:
          type: [number, "null"]
          minimum: 0
        observedAt:
          type: [string, "null"]
          format: date-time
        receivedAt:
          type: string
          format: date-time
        sourceType:
          type: [string, "null"]
        dataFreshness:
          $ref: "#/components/schemas/AisFreshness"
        rawDataReference:
          type: [string, "null"]
    VesselAisResponse:
      type: object
      additionalProperties: false
      required:
        [
          vesselId,
          status,
          simulation,
          telemetry,
          attempts,
          checkedAt,
          cacheHit,
          freshForSeconds,
          staleAfterSeconds,
        ]
      properties:
        vesselId:
          type: string
          format: uuid
        status:
          type: string
          enum: [NOT_CONFIGURED, AVAILABLE, UNAVAILABLE]
        simulation:
          type: boolean
        telemetry:
          anyOf:
            - $ref: "#/components/schemas/NormalizedVesselTelemetry"
            - type: "null"
        attempts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [provider, outcome]
            properties:
              provider:
                type: string
              outcome:
                type: string
        checkedAt:
          type: string
          format: date-time
        cacheHit:
          type: boolean
        freshForSeconds:
          type: integer
          minimum: 1
        staleAfterSeconds:
          type: integer
          minimum: 1
    AisIdentityIdentifierType:
      type: string
      enum: [ENI, MMSI, IMO, VESSELFINDER_ID, MARINETRAFFIC_ID, OTHER]
    AisIdentityEvidence:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 200
        reference:
          type: string
          maxLength: 1000
        notes:
          type: string
          maxLength: 2000
        capturedAt:
          type: string
          format: date-time
    AisIdentityCreateRequest:
      type: object
      additionalProperties: false
      required: [identifierType, identifierValue]
      properties:
        identifierType:
          $ref: "#/components/schemas/AisIdentityIdentifierType"
        identifierValue:
          type: string
          minLength: 1
          maxLength: 200
          description: Stable ENI, MMSI, IMO, or provider identifier; never a vessel name.
        provider:
          type: [string, "null"]
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
        verified:
          type: boolean
          enum: [false]
          default: false
          description: Tenant claims are always unverified. Only the server-filesystem operator verification procedure may promote a claim.
        evidence:
          anyOf:
            - $ref: "#/components/schemas/AisIdentityEvidence"
            - type: "null"
    AisIdentityUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        identifierType:
          $ref: "#/components/schemas/AisIdentityIdentifierType"
        identifierValue:
          type: string
          minLength: 1
          maxLength: 200
          description: Stable ENI, MMSI, IMO, or provider identifier; never a vessel name.
        provider:
          type: [string, "null"]
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
        verified:
          type: boolean
          enum: [false]
          description: Set false to revoke an operator verification. Tenant updates cannot promote a claim.
        evidence:
          anyOf:
            - $ref: "#/components/schemas/AisIdentityEvidence"
            - type: "null"
    VesselAisIdentity:
      type: object
      additionalProperties: false
      required:
        - id
        - companyId
        - vesselId
        - identifierType
        - identifierValue
        - provider
        - verified
        - evidence
        - verifiedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        vesselId:
          type: string
          format: uuid
        identifierType:
          $ref: "#/components/schemas/AisIdentityIdentifierType"
        identifierValue:
          type: string
        provider:
          type: [string, "null"]
        verified:
          type: boolean
        evidence:
          anyOf:
            - $ref: "#/components/schemas/AisIdentityEvidence"
            - type: "null"
        verifiedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
