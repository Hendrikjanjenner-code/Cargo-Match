openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken.
  title: Api
  version: 0.1.0
  description: |
    CargoMatch pilot API. This contract covers privacy-safe discovery,
    consent, and communication for inland waterway and Deepsea Dry Bulk
    capacity. CargoMatch is not a booking, reservation, or freight-contract API.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Company
    description: The current user's company.
  - name: Vessels
    description: Vessels owned by the current user's company.
  - name: Vessel identities
    description: Tenant-scoped, verified external AIS identities for owned vessels.
  - name: Locations
    description: Curated inland-shipping location catalogue.
  - name: Listings
    description: Owned cargo and capacity listings.
  - name: Liner
    description: Liner services, sailings, breakbulk cargo, and shared-consent matches.
  - name: Availability suggestions
    description: Private, manually submitted operational availability plans.
  - name: Marketplace
    description: Privacy-safe open-network discovery.
  - name: Matches
    description: Eligibility-filtered match opportunities and consent actions.
  - name: Conversations
    description: Conversations available after a match is connected.
  - name: Notifications
    description: In-app notifications for the current user.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"

  /company:
    get:
      tags: [Company]
      operationId: getMyCompany
      summary: Get the current user's company
      description: Returns only the company associated with the current user's active membership.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Current company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Company]
      operationId: createMyCompany
      summary: Create a company for the current user
      description: Creates the first company and OWNER membership for an authenticated user.
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyCreateRequest"
      responses:
        "201":
          description: Company created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The user already belongs to a company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [Company]
      operationId: updateMyCompany
      summary: Update the current user's company
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdateRequest"
      responses:
        "200":
          description: Company updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /vessels:
    get:
      tags: [Vessels]
      operationId: listMyVessels
      summary: List the current company's vessels
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: activeOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: transportMode
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TransportMode"
      responses:
        "200":
          description: Owned vessels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VesselListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Vessels]
      operationId: createMyVessel
      summary: Create a vessel for the current company
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VesselCreateRequest"
      responses:
        "201":
          description: Vessel created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vessel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /vessels/{vesselId}:
    parameters:
      - $ref: "#/components/parameters/VesselId"
    get:
      tags: [Vessels]
      operationId: getMyVessel
      summary: Get one of the current company's vessels
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Owned vessel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vessel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Vessels]
      operationId: updateMyVessel
      summary: Update one of the current company's vessels
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VesselUpdateRequest"
      responses:
        "200":
          description: Vessel updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vessel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /vessels/{vesselId}/deactivate:
    post:
      tags: [Vessels]
      operationId: deactivateMyVessel
      summary: Deactivate a vessel
      description: Vessels are deactivated rather than deleted so historical listings remain auditable.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VesselId"
      responses:
        "200":
          description: Vessel deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vessel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /vessels/{vesselId}/ais:
    get:
      tags: [Vessels]
      operationId: getMyVesselAis
      summary: Read AIS context for an owned vessel
      description: |
        Read-only, company-scoped AIS enhancement. Development simulation is
        explicitly labelled and unavailable in production. Never changes
        commercial availability or grants telemetry access to counterparties.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VesselId"
      responses:
        "200":
          description: AIS context, including not-configured and unavailable states.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VesselAisResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /vessels/{vesselId}/ais-identities:
    parameters:
      - $ref: "#/components/parameters/VesselId"
    get:
      tags: [Vessel identities]
      operationId: listMyVesselAisIdentities
      summary: List AIS identities for an owned vessel
      description: |
        Returns only mappings and conflict attempts belonging to the current
        user's company. Names are not accepted as identity keys and no other
        tenant's mapping or conflict details are disclosed.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Tenant-scoped AIS identity mappings and conflicts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VesselAisIdentityListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Vessel identities]
      operationId: registerMyVesselAisIdentity
      summary: Register an AIS identity for an owned vessel
      description: |
        OWNER and ADMIN only. Registration is atomic and the stable external
        identity is globally unique. A duplicate returns a generic conflict
        without revealing the owning tenant.
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AisIdentityCreateRequest"
      responses:
        "201":
          description: AIS identity registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VesselAisIdentity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The stable external identity is already mapped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AisIdentityConflictError"

  /vessels/{vesselId}/ais-identities/{mappingId}:
    parameters:
      - $ref: "#/components/parameters/VesselId"
      - name: mappingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Vessel identities]
      operationId: updateMyVesselAisIdentity
      summary: Update an AIS identity mapping
      description: OWNER and ADMIN only. Updating the stable key re-checks global uniqueness atomically.
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AisIdentityUpdateRequest"
      responses:
        "200":
          description: AIS identity updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VesselAisIdentity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The stable external identity is already mapped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AisIdentityConflictError"
    delete:
      tags: [Vessel identities]
      operationId: deleteMyVesselAisIdentity
      summary: Delete an AIS identity mapping
      description: OWNER and ADMIN only.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "204":
          description: AIS identity deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /locations:
    get:
      tags: [Locations]
      operationId: listLocations
      summary: List active catalogue locations
      description: Returns curated inland-shipping locations; arbitrary free-form addresses are not part of the pilot.
      security: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: country
          in: query
          required: false
          schema:
            type: string
        - name: locationType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LocationType"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Active catalogue locations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationListResponse"

  /cargo:
    get:
      tags: [Listings]
      operationId: listMyCargo
      summary: List the current company's cargo listings
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: listingStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ListingStatus"
        - name: transportMode
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TransportMode"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Owned cargo listings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargoListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Listings]
      operationId: createMyCargo
      summary: Create a cargo listing for the current company
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CargoListingCreateRequest"
      responses:
        "201":
          description: Cargo listing created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargoListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /cargo/{cargoId}:
    parameters:
      - $ref: "#/components/parameters/CargoId"
    get:
      tags: [Listings]
      operationId: getMyCargo
      summary: Get one of the current company's cargo listings
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Owned cargo listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargoListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Listings]
      operationId: updateMyCargo
      summary: Update one of the current company's cargo listings
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CargoListingUpdateRequest"
      responses:
        "200":
          description: Cargo listing updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargoListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /cargo/{cargoId}/withdraw:
    post:
      tags: [Listings]
      operationId: withdrawMyCargo
      summary: Withdraw a cargo listing
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CargoId"
      responses:
        "200":
          description: Cargo listing withdrawn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargoListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /cargo/{cargoId}/close:
    post:
      tags: [Listings]
      operationId: closeMyCargo
      summary: Close a cargo listing
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CargoId"
      responses:
        "200":
          description: Cargo listing closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CargoListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /capacity:
    get:
      tags: [Listings]
      operationId: listMyCapacity
      summary: List the current company's capacity offers
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: listingStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ListingStatus"
        - name: transportMode
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TransportMode"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Owned capacity offers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Listings]
      operationId: createMyCapacity
      summary: Create a capacity offer for the current company
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapacityOfferCreateRequest"
      responses:
        "201":
          description: Capacity offer created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityOffer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /availability-suggestions:
    get:
      tags: [Availability suggestions]
      operationId: listMyAvailabilitySuggestions
      summary: List private availability suggestions
      description: |
        Lists only suggestions owned by the current company. Suggestions are
        operational manual plans, not telemetry or ETA predictions. Statuses
        EXPIRED and INVALIDATED are derived at read time.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Private availability suggestions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilitySuggestionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Availability suggestions]
      operationId: createAvailabilitySuggestion
      summary: Submit a manually observed availability suggestion
      description: |
        OWNER and ADMIN only. Requires an independently operator-reviewed
        active AIS identity at submission. No provider request or telemetry is
        made or stored. Dates remain explicitly uncertain.
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilitySuggestionCreateRequest"
      responses:
        "201":
          description: Availability suggestion created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilitySuggestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /availability-suggestions/{suggestionId}/dismiss:
    post:
      tags: [Availability suggestions]
      operationId: dismissAvailabilitySuggestion
      summary: Dismiss an availability suggestion
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AvailabilitySuggestionId"
      responses:
        "200":
          description: Availability suggestion dismissed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilitySuggestion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /capacity/{capacityId}:
    parameters:
      - $ref: "#/components/parameters/CapacityId"
    get:
      tags: [Listings]
      operationId: getMyCapacity
      summary: Get one of the current company's capacity offers
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Owned capacity offer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityOffer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Listings]
      operationId: updateMyCapacity
      summary: Update one of the current company's capacity offers
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapacityOfferUpdateRequest"
      responses:
